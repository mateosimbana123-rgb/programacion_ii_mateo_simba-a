<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Editar autor{% else %}Crear autor{% endif %}</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Editar autor{% else %}Crear autor{% endif %}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
            <button type="submit">Guardar autor</button>
    </form>
</body>
</html>
