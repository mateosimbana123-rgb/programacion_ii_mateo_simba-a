<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102a43">
    <title>Iniciar sesión | Biblioteca</title>
    <style>
        :root {
            color-scheme: light;
            --navy: #102a43;
            --blue: #176b87;
            --ink: #172b4d;
            --muted: #62748a;
            --line: #dce5eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            background:
                radial-gradient(ellipse at 82% 10%, rgba(216, 243, 232, 0.9), transparent 34rem),
                linear-gradient(145deg, #f3f6f8, #eaf1f4);
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .login-card {
            width: min(440px, 100%);
            padding: clamp(26px, 6vw, 42px);
            border: 1px solid rgba(220, 229, 235, 0.9);
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 64px rgba(16, 42, 67, 0.13);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-mark {
            display: grid;
            width: 48px;
            height: 48px;
            place-items: center;
            border-radius: 14px;
            background: #d8f3e8;
            color: var(--navy);
            font-family: Georgia, serif;
            font-size: 27px;
            font-weight: 700;
        }

        .brand strong,
        .brand small {
            display: block;
        }

        .brand strong {
            color: var(--navy);
            font-size: 17px;
        }

        .brand small {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--blue);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--navy);
            font-size: clamp(28px, 7vw, 34px);
            letter-spacing: -0.035em;
        }

        .intro {
            margin: 10px 0 26px;
            color: var(--muted);
            line-height: 1.6;
        }

        form p {
            margin: 0 0 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #344b63;
            font-size: 13px;
            font-weight: 700;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #cbd6df;
            border-radius: 10px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font: inherit;
        }

        input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(23, 107, 135, 0.13);
        }

        .errorlist {
            margin: 6px 0 0;
            padding-left: 18px;
            color: #b42332;
            font-size: 13px;
        }

        .error-message {
            margin: 0 0 18px;
            padding: 11px 13px;
            border: 1px solid #f1c2c6;
            border-radius: 10px;
            background: #fff1f2;
            color: #a21d2a;
            font-size: 14px;
        }

        button {
            width: 100%;
            min-height: 46px;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            background: var(--blue);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            background: #10566d;
        }

        .footer {
            margin: 22px 0 0;
            color: #8190a0;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span>
                <strong>Biblioteca</strong>
                <small>Sistema de gestión bibliotecaria</small>
            </span>
        </div>

        <p class="eyebrow">Acceso seguro</p>
        <h1>Bienvenido</h1>
        <p class="intro">Inicia sesión para administrar los libros, autores y categorías.</p>

        {% if form.errors %}
            <p class="error-message" role="alert">Usuario o contraseña incorrectos.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Iniciar sesión</button>
        </form>

        <p class="footer">Biblioteca · Gestión de catálogo</p>
    </main>
</body>
</html>
