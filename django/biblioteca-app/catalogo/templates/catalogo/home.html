<!DOCTYPE html>
<html lang="es">  
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicio</title>
    </head>
    <body>
        <h1>Inicio</h1>
        <p>Bienvenido Sr(a). {{request.user.get_full_name}} a la aplicación</p>

        <form method="post" action="{% url 'logout' %}">

    </body>
