<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Taller de Carpintería{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f1eb; color: #26231f; }
        nav { background: #263c2c; padding: 14px 24px; }
        nav a { color: white; text-decoration: none; margin-right: 18px; }
        main { max-width: 1100px; margin: 24px auto; background: white; padding: 24px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
        form p { margin: 12px 0; }
        input, select, textarea { padding: 8px; max-width: 100%; }
        .actions a { margin-right: 8px; }
        .button { display: inline-block; background: #263c2c; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'mueble_list' %}">Muebles</a>
        <a href="{% url 'categoria_list' %}">Categorías</a>
        <a href="{% url 'cliente_list' %}">Clientes</a>
        <a href="{% url 'pedido_list' %}">Pedidos</a>
        <a href="/admin/">Administración</a>
    </nav>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
