{% extends 'taller/base.html' %}
{% block content %}
<h1>Categorías</h1>
<a class="button" href="{% url 'categoria_create' %}">Nueva categoría</a>
<table style="margin-top:18px">
<thead><tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead>
<tbody>{% for categoria in categorias %}<tr>
<td>{{ categoria.nombre }}</td><td>{{ categoria.descripcion }}</td>
<td class="actions"><a href="{% url 'categoria_update' categoria.pk %}">Editar</a><a href="{% url 'categoria_delete' categoria.pk %}">Eliminar</a></td>
</tr>{% empty %}<tr><td colspan="3">No hay categorías.</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
