{% extends 'taller/base.html' %}
{% block content %}
<h1>Clientes</h1>
<a class="button" href="{% url 'cliente_create' %}">Nuevo cliente</a>
<table style="margin-top:18px">
<thead><tr><th>Nombre</th><th>Teléfono</th><th>Email</th><th>Acciones</th></tr></thead>
<tbody>{% for cliente in clientes %}<tr>
<td>{{ cliente.nombre }} {{ cliente.apellido }}</td><td>{{ cliente.telefono }}</td><td>{{ cliente.email }}</td>
<td class="actions"><a href="{% url 'cliente_update' cliente.pk %}">Editar</a><a href="{% url 'cliente_delete' cliente.pk %}">Eliminar</a></td>
</tr>{% empty %}<tr><td colspan="4">No hay clientes.</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
